# CLI Anything Workflow Add New Agent Harness

## Action

Follow the add-new-agent-harness workflow:
1. Create tool-specific directory under <tool>/agent-harness/
2. Add <TOOL>.md and HARNESS.md (optional) for documentation
3. Implement CLI entrypoint: cli_anything/<tool>/<tool>_cli.py (and sometimes __main__.py)
4. Implement core modules: cli_anything/<tool>/core/*.py (project/session/export/etc.)
5. Add utils: cli_anything/<tool>/utils/*.py (backend wrappers, REPL skins, etc.)
6. Add tests: cli_anything/<tool>/tests/{__init__.py, test_core.py, test_full_e2e.py, TEST.md}
7. Add or update setup.py in agent-harness/
8. Update .gitignore and README.md as needed

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: <tool>/agent-harness/<TOOL>.md, <tool>/agent-harness/cli_anything/<tool>/README.md, <tool>/agent-harness/cli_anything/<tool>/__init__.py

