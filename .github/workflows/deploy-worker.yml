name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'hermes-infra/worker/**'
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy hermes-license-proxy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-infra/worker

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

  deploy-landing:
    name: Deploy landing page
    runs-on: ubuntu-latest
    needs: deploy-worker

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler
          npx wrangler pages deploy hermes-infra/landing \
            --project-name hermes-landing \
            --branch main \
            --commit-dirty=true
