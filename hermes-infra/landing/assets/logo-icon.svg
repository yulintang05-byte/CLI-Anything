<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="120" y1="180" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7ff0f0"/>
      <stop offset="1" stop-color="#4fd0d0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#262626" stroke-width="2"/>

  <!-- wings flanking the prompt (Hermes nod) -->
  <g fill="url(#cyan)" opacity="0.9">
    <path d="M150 196 q-46 6 -74 34 q40 -10 74 -2 z"/>
    <path d="M150 230 q-38 4 -60 26 q33 -8 60 -2 z"/>
    <path d="M362 196 q46 6 74 34 q-40 -10 -74 -2 z"/>
    <path d="M362 230 q38 4 60 26 q-33 -8 -60 -2 z"/>
  </g>

  <!-- terminal prompt  >_ -->
  <g filter="url(#glow)">
    <path d="M176 184 L256 256 L176 328" stroke="url(#cyan)" stroke-width="34"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="270" y="300" width="86" height="30" rx="8" fill="url(#cyan)"/>
  </g>
</svg>
