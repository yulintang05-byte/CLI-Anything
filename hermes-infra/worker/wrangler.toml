name            = "hermes-license-proxy"
main            = "src/index.js"
compatibility_date = "2024-01-01"

# ---------------------------------------------------------------------------
# Workers & Pages — runtime settings
# ---------------------------------------------------------------------------

# Keep the worker lean: no Node.js compatibility shims needed.
# Remove the line below if you ever need Node built-ins (e.g. `crypto`).
# compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Environment variables (non-secret, safe to commit)
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"

# ---------------------------------------------------------------------------
# Secrets (values stored encrypted in Cloudflare — never committed to VCS)
# Deploy with:
#   wrangler secret put WHOP_API_KEY
# ---------------------------------------------------------------------------
[[secrets]]
name = "WHOP_API_KEY"

# ---------------------------------------------------------------------------
# Optional: preview / staging environment
# wrangler deploy --env staging
# ---------------------------------------------------------------------------
# [env.staging]
# name = "hermes-license-proxy-staging"
# [env.staging.vars]
# ENVIRONMENT = "staging"
